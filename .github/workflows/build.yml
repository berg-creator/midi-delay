name: build

on:
  push:
    branches: [main]
  pull_request:

# Один прогон на ветку: новый push отменяет предыдущий, недосчитанный.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # На Windows генератор не задаём: Ninja сам не найдёт cl.exe, а называть версию
          # Visual Studio явно нельзя — она меняется вместе с образом раннера (на «17 2022»
          # прогон падал с «could not find any instance of Visual Studio»). Дефолтный
          # генератор CMake находит ту студию, что реально стоит.
          # AU в форматы добавлять не надо: JUCE отбрасывает его на не-Apple сама,
          # в _juce_get_platform_plugin_kinds.
          - name: macOS
            os: macos-latest
            cmake_args: -G Ninja
            pluginval: pluginval.app/Contents/MacOS/pluginval
          - name: Windows
            os: windows-latest
            cmake_args: ""
            pluginval: ./pluginval.exe

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Настроить
        run: >
          cmake -B build ${{ matrix.cmake_args }}
          -DCMAKE_BUILD_TYPE=Release
          -DMIDIDELAY_COPY_PLUGIN=OFF

      - name: Собрать
        run: cmake --build build --config Release --parallel

      - name: Скачать pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_macOS.zip"
          unzip -q pluginval.zip
          chmod +x "${{ matrix.pluginval }}"

      - name: Скачать pluginval (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_Windows.zip"
          7z x -y pluginval.zip > /dev/null

      # Ненулевой код возврата pluginval роняет шаг, а с ним и весь прогон.
      - name: pluginval, strictness 10
        shell: bash
        run: |
          mkdir -p pluginval-log
          "${{ matrix.pluginval }}" \
            --strictness-level 10 \
            --validate-in-process \
            --output-dir pluginval-log \
            --validate "build/MidiDelay_artefacts/Release/VST3/MIDI Delay.vst3"

      - name: Лог pluginval
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pluginval-${{ matrix.name }}
          path: pluginval-log/

      - name: Артефакты плагина
        uses: actions/upload-artifact@v7
        with:
          name: MIDI-Delay-${{ matrix.name }}
          path: |
            build/MidiDelay_artefacts/Release/VST3/
            build/MidiDelay_artefacts/Release/AU/
